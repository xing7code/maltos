# Reusable synthetic-performance experiments for tools/profile_train_perf.py.
#
# A case selects a normal training recipe (or runtime_spec.json) and can add
# ordinary train/cli flags. The profiler ignores recipe data/checkpoint/W&B
# settings: it supplies deterministic synthetic causal-LM batches instead.
# `packed: true` is a variable packed-SFT workload. `packed: false` is dense
# pretraining. The tool uses lr=0 by default, so these are
# stability/performance probes, not training-quality experiments.

cases:
  olmo2_13b_sft_packed:
    description: Recipe-faithful packed-SFT systems baseline for 8xA100.
    recipe: configs/olmo2_13b_sft.yaml
    synthetic:
      # packed=true is a packed-SFT workload; packed=false is dense pretraining.
      packed: true
      segment_count_min: 3
      segment_count_max: 7
      # Calibrated from this recipe's packed meta: 491,761,197 supervised
      # targets / 786,268,160 physical tokens = 62.54%, with small per-example
      # variation instead of a fixed mask.
      supervised_fraction_min: 0.55
      supervised_fraction_max: 0.70
      # The same meta records 1.00% physical padding. Uniform [0, 2%] gives
      # that mean while preserving variable packed rows.
      max_padding_fraction: 0.02
      # Trainer-like CPU batch creation and RuntimeCore's normal H2D move.
      delivery: host
      data_source: synthetic
    warmup: 5
    steps: 10

  olmo2_13b_sft_dense:
    description: Dense causal upper-bound comparison; unlike packed SFT it omits sequence_ids.
    recipe: configs/olmo2_13b_sft.yaml
    synthetic:
      packed: false
      delivery: host
      data_source: synthetic
    warmup: 5
    steps: 10

  olmo2_13b_sft_packed_mb2:
    description: "Memory/throughput probe: double micro-batch and halve accumulation at fixed global batch."
    recipe: configs/olmo2_13b_sft.yaml
    recipe_overrides:
      - --micro-batch-size
      - "2"
      - --grad-accum-steps
      - "8"
    synthetic:
      packed: true
      segment_count_min: 3
      segment_count_max: 7
      supervised_fraction_min: 0.55
      supervised_fraction_max: 0.70
      max_padding_fraction: 0.02
      delivery: host
      data_source: synthetic
    warmup: 5
    steps: 10

  olmo2_13b_sft_real_data:
    description: "Exact packed-SFT dataloader path: mmap shards, CPU stack, DP stride, and H2D."
    recipe: configs/olmo2_13b_sft.yaml
    synthetic:
      # This mode ignores synthetic fields and reuses recipe data exactly.
      data_source: recipe
    warmup: 5
    steps: 10

  olmo2_13b_hdp_flash_gqa_packed_8xa100_preflight:
    description: >-
      OLMo2-like 13B GQA HDP Flash-Ring preflight for 8xA100-80G: 8 dynamic HDP participants,
      ZeRO-1, activation checkpointing, native 40Q/8KV GQA, packed short and
      long documents, and multiple ordered waves. This is a systems smoke
      workload; replace the uncalibrated cost coefficients before reporting a
      paper-faithful scheduler comparison.
    recipe: configs/olmo2_13b_sft.yaml
    recipe_overrides:
      # HDP replaces fixed CP and schedules across all eight DP ranks.
      - --dp-size
      - "8"
      - --tp-size
      - "1"
      - --cp-size
      - "1"
      - --no-use-sp
      - --zero-stage
      - "1"
      - --hdp-balanced
      - --hdp-partition-tokens
      # 4K packed rows with global logical micro_batch_size=2 exceed one
      # 8x512-token HDP wave, ensuring ordered multi-wave execution.
      - "512"
      - --micro-batch-size
      - "2"
      - --grad-accum-steps
      - "1"
      - --data-prefetch-batches
      - "1"
      - --attention-backend
      - flash_attn
      # Exercise native-GQA transport: K/V stay at 8 heads while Q has 40.
      - --n-kv-heads
      - "8"
      # Explicitly record the current L^2-only pre-calibration policy. Pass
      # calibrated alpha/beta/gamma after the profiling fit is available.
      - --hdp-cost-alpha
      - "1.0"
      - --hdp-cost-beta
      - "0.0"
      - --hdp-cost-gamma
      - "0.0"
      - --hdp-balance-delta
      - "0.0"
    synthetic:
      packed: true
      # Several uneven documents make both D=1 fused local Flash documents
      # and multi-rank Flash Ring documents likely in every logical batch.
      segment_count_min: 5
      segment_count_max: 9
      supervised_fraction_min: 0.55
      supervised_fraction_max: 0.70
      max_padding_fraction: 0.02
      delivery: host
      data_source: synthetic
    warmup: 5
    steps: 10

  olmo2_13b_hdp_flash_gqa_packed_8xa100_paper:
    description: >-
      OLMo2-like 13B GQA 8xA100-80G paper measurement: fixed packed document
      trace covers HDP D1/D2/D4/D8, host-side synthetic generation and HDP
      scheduling/materialization prefetch, Flash Ring, ZeRO-1, and activation
      checkpointing. This case refuses the uncalibrated 1/0/0 cost proxy;
      pass calibrated alpha/beta/gamma after --.
    recipe: configs/olmo2_13b_sft.yaml
    require_calibrated_hdp_cost: true
    recipe_overrides:
      - --dp-size
      - "8"
      - --tp-size
      - "1"
      - --cp-size
      - "1"
      - --no-use-sp
      - --zero-stage
      - "1"
      - --hdp-balanced
      - --hdp-partition-tokens
      - "512"
      - --micro-batch-size
      - "2"
      - --grad-accum-steps
      - "1"
      - --data-prefetch-batches
      - "1"
      - --attention-backend
      - flash_attn
      - --n-kv-heads
      - "8"
    synthetic:
      packed: true
      # Row 0: D8. Row 1: D4 + D2 + D1. Active=7,680 <= nominal=8,192.
      document_length_trace:
        - [4096]
        - [2048, 1024, 512]
      delivery: host
      data_source: synthetic
    warmup: 20
    steps: 200

  llama50m_cp_ring_dense_smoke:
    description: "Dense Flash-Ring correctness/performance smoke: 8 CP ranks, 1K local tokens/rank."
    recipe: configs/llama_50m.yaml
    recipe_overrides:
      - --dp-size
      - "1"
      - --tp-size
      - "1"
      - --cp-size
      - "8"
      - --cp-attn-core
      - ring
      - --batch-data-cp-aware
      - --cp-token-planner
      - fixed_zigzag
      - --no-use-sp
      - --zero-stage
      - "0"
      - --attention-backend
      - flash_attn
      # CP owns a zigzag shard of this global sequence, so each rank sees
      # 1,024 tokens. This is the inexpensive preflight for the 256K run.
      - --seq-len
      - "8192"
      - --grad-accum-steps
      - "1"
    synthetic:
      packed: false
      delivery: host
      data_source: synthetic
    warmup: 3
    steps: 5

  llama50m_cp_ring_dense_256k:
    description: "Paper-scale dense Flash-Ring baseline: 32K local tokens/rank across 8 CP ranks."
    recipe: configs/llama_50m.yaml
    recipe_overrides:
      - --dp-size
      - "1"
      - --tp-size
      - "1"
      - --cp-size
      - "8"
      - --cp-attn-core
      - ring
      - --batch-data-cp-aware
      - --cp-token-planner
      - fixed_zigzag
      - --no-use-sp
      - --zero-stage
      - "0"
      - --attention-backend
      - flash_attn
      # 256K global / CP=8 = 32K local tokens, matching FCP's reported
      # per-worker workload contract. It is a dense sanity baseline, not the
      # final packed long-tailed workload.
      - --seq-len
      - "262144"
      - --grad-accum-steps
      - "1"
    synthetic:
      packed: false
      delivery: host
      data_source: synthetic
    warmup: 3
    steps: 10
